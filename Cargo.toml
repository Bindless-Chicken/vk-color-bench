[package]
name = "vk-color-bench"
description = "Color analysis overlay for Vulkan swapchains"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[package.metadata.vulkan-layer]
name = "VK_LAYER_BC_Color_Bench"
type = "GLOBAL"
api-version = "1.1.0"

[lib]
crate-type = ["cdylib"]
name = "VkLayer_bc_color_bench"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
log = "0.4.33"
env_logger = "0.11.11"

# Vulkan layer forces that version of ash and its deps
vulkan-layer = { git = "https://github.com/google/vk-layer-for-rust", rev = "102d87cd9781c045b232e77eef198eed75ce8a8c" }
ash = { version = "0.37.3" }
egui = { version = "0.28.1", default-features = false, features = ["default_fonts"] }
egui-ash-renderer = "0.4.0"

once_cell = "1.17.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
toml = "1.1.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
